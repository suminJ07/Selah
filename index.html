<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>청년부 기도 음악 컨트롤러</title><style>
:root{font-family:system-ui,'Malgun Gothic',sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#f1f5f9;min-height:100vh;display:grid;place-items:center;padding:20px}.app{width:min(100%,650px);background:#172235;border:1px solid #334155;border-radius:20px;padding:28px;box-shadow:0 20px 60px #0005}h1{font-size:26px;margin:0 0 6px}.sub{color:#a8b7ce;margin:0 0 24px}label{display:block;font-weight:650;margin-bottom:8px}.urlrow{display:flex;gap:8px}input{width:100%;min-width:0;border:1px solid #52637c;background:#0c1728;color:white;padding:14px;border-radius:10px;font-size:15px}button{cursor:pointer;border:0;border-radius:11px;padding:15px 18px;font-weight:750;font-size:16px;color:white}button:disabled{opacity:.42;cursor:not-allowed}.load{background:#475569;white-space:nowrap}.playerwrap{margin-top:18px;background:#070c15;border-radius:12px;overflow:hidden;aspect-ratio:16/9;display:grid;place-items:center}.playerwrap>div{width:100%;height:100%}.placeholder{color:#94a3b8;text-align:center;padding:20px}.settings{display:flex;gap:16px;align-items:center;justify-content:space-between;margin:20px 0}.settings label{margin:0}.options{display:flex;gap:5px}.options button{background:#334155;padding:10px 14px;font-size:14px}.options button.active{background:#2563eb}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}.start{background:#2563eb}.end{background:#c24137}.status{min-height:52px;margin-top:18px;padding:12px;background:#0c1728;border-radius:10px;color:#cbd5e1;line-height:1.5}.small{color:#94a3b8;font-size:13px;line-height:1.6;margin:16px 0 0}.vol{display:flex;align-items:center;gap:12px;margin-top:18px}.vol label{margin:0;white-space:nowrap}.vol input{accent-color:#60a5fa;padding:0}.vol span{min-width:38px;text-align:right}@media(max-width:470px){.app{padding:18px}.settings{align-items:flex-start;flex-direction:column}.actions{grid-template-columns:1fr}h1{font-size:22px}}
</style></head><body><main class="app"><h1>🎵 기도 음악 컨트롤러</h1><p class="sub">청년부 예배 · 링크 붙여넣기 → 시작 → 종료</p><label for="url">유튜브 음악 주소</label><div class="urlrow"><input id="url" type="url" placeholder="https://youtu.be/..." autocomplete="off"><button class="load" id="load">불러오기</button></div><div class="playerwrap" id="playerWrap"><div class="placeholder" id="placeholder">유튜브 주소를 입력하고<br>불러오기를 눌러주세요.</div></div><div class="vol"><label for="volume">시작 볼륨</label><input id="volume" type="range" min="0" max="100" value="70"><span id="volumeText">70%</span></div><div class="settings"><label>페이드 아웃 시간</label><div class="options" id="fadeOptions"><button data-sec="3">3초</button><button data-sec="4">4초</button><button data-sec="5" class="active">5초</button></div></div><div class="actions"><button id="start" class="start" disabled>▶ 음악 시작</button><button id="end" class="end" disabled>◼ 음악 종료</button></div><div class="status" id="status" role="status" aria-live="polite">음악 주소를 입력해 주세요.</div><p class="small">※ 이 페이지에서 재생한 음악만 제어합니다. PC 전체 음소거는 하지 않습니다.<br>※ 일부 유튜브 영상은 외부 사이트 재생이 차단될 수 있습니다. 예배 전에 재생 여부를 확인해 주세요.</p></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),url=$('url'),load=$('load'),start=$('start'),end=$('end'),status=$('status'),vol=$('volume'),volText=$('volumeText');let player=null,ready=false,fadeSec=5,fadeTimer=null,fadeToken=0,loadedId='',mode='empty',apiLoaded=false;const say=s=>status.textContent=s;const save=()=>{try{localStorage.setItem('prayerSettings',JSON.stringify({url:url.value,volume:+vol.value,fadeSec}))}catch(e){}};try{const x=JSON.parse(localStorage.getItem('prayerSettings')||'{}');if(x.url)url.value=x.url;if(Number.isFinite(x.volume))vol.value=Math.min(100,Math.max(0,x.volume));if([3,4,5].includes(x.fadeSec))fadeSec=x.fadeSec}catch(e){}volText.textContent=vol.value+'%';document.querySelectorAll('[data-sec]').forEach(b=>b.classList.toggle('active',+b.dataset.sec===fadeSec));function parseId(s){try{const u=new URL(s.trim());const host=u.hostname.toLowerCase().replace(/^www\./,'');let id='';if(host==='youtu.be')id=u.pathname.split('/')[1];else if(['youtube.com','m.youtube.com','music.youtube.com','youtube-nocookie.com'].includes(host)){if(u.pathname==='/watch')id=u.searchParams.get('v');else if(/^\/(embed|shorts|live)\//.test(u.pathname))id=u.pathname.split('/')[2]}return /^[a-zA-Z0-9_-]{11}$/.test(id||'')?id:null}catch(e){return null}}function buttons(){start.disabled=!ready||mode==='playing'||mode==='fading';end.disabled=!ready||mode!=='playing';load.disabled=mode==='fading'}function cancelFade(){fadeToken++;if(fadeTimer!==null){clearInterval(fadeTimer);fadeTimer=null}}function ensureApi(){if(apiLoaded)return;apiLoaded=true;const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';s.onerror=()=>{say('유튜브 연결에 실패했습니다. 인터넷 연결을 확인해 주세요.');apiLoaded=false};document.head.appendChild(s)}function createPlayer(id){ready=false;mode='loading';buttons();say('영상 연결 중입니다…');if(player){try{player.destroy()}catch(e){}player=null}const wrap=$('playerWrap');wrap.replaceChildren();const node=document.createElement('div');node.id='yt-player';wrap.appendChild(node);player=new YT.Player('yt-player',{videoId:id,width:'100%',height:'100%',playerVars:{playsinline:1,rel:0,origin:location.origin.startsWith('http')?location.origin:undefined},events:{onReady:e=>{ready=true;mode='ready';e.target.setVolume(+vol.value);e.target.pauseVideo();buttons();say('음악 준비 완료. ▶ 음악 시작을 눌러주세요.')},onStateChange:e=>{if(!ready||mode==='fading')return;if(e.data===YT.PlayerState.PLAYING){mode='playing';say('음악 재생 중입니다. 예배 시작 직전에 음악 종료를 눌러주세요.')}else if(e.data===YT.PlayerState.ENDED){mode='ready';say('영상 재생이 끝났습니다.')}else if(e.data===YT.PlayerState.PAUSED&&mode==='playing'){mode='ready';say('음악이 일시정지되었습니다.')}buttons()},onError:e=>{ready=false;mode='error';buttons();const desc={2:'유튜브 주소를 확인해 주세요.',5:'영상 플레이어에서 오류가 발생했습니다.',100:'삭제되었거나 비공개 영상입니다.',101:'이 영상은 외부 웹사이트에서 재생할 수 없습니다.',150:'이 영상은 외부 웹사이트에서 재생할 수 없습니다.'};say('영상 오류 ('+e.data+'): '+(desc[e.data]||'다른 유튜브 영상을 사용해 주세요.'))}}})}window.onYouTubeIframeAPIReady=()=>{if(loadedId)createPlayer(loadedId)};load.onclick=()=>{const id=parseId(url.value);if(!id){say('올바른 유튜브 영상 링크를 입력해 주세요. (재생목록 링크만으로는 불가)');return}cancelFade();loadedId=id;save();if(window.YT&&YT.Player)createPlayer(id);else{mode='loading';buttons();say('유튜브 플레이어를 불러오는 중입니다…');ensureApi()}};start.onclick=()=>{if(!ready||!player)return;cancelFade();player.unMute();player.setVolume(+vol.value);player.playVideo();mode='playing';buttons();say('음악 재생을 시작합니다…')};end.onclick=()=>{if(!ready||!player||mode!=='playing')return;cancelFade();mode='fading';buttons();const token=fadeToken,initial=player.getVolume(),started=performance.now(),duration=fadeSec*1000;say(fadeSec+'초 동안 음악을 서서히 줄이고 있습니다…');fadeTimer=setInterval(()=>{if(token!==fadeToken)return;const p=Math.min(1,(performance.now()-started)/duration);try{player.setVolume(Math.round(initial*(1-p)));if(p>=1){clearInterval(fadeTimer);fadeTimer=null;player.setVolume(0);player.mute();player.pauseVideo();mode='ready';buttons();say('음악 종료 완료. 볼륨 0%, 플레이어 음소거 및 일시정지되었습니다.')}}catch(e){cancelFade();mode='error';buttons();say('페이드 아웃 중 오류가 발생했습니다. 플레이어를 확인해 주세요.')}},50)};vol.oninput=()=>{volText.textContent=vol.value+'%';save();if(ready&&mode!=='fading'){try{player.setVolume(+vol.value)}catch(e){}}};url.onchange=save;document.querySelectorAll('[data-sec]').forEach(b=>b.onclick=()=>{fadeSec=+b.dataset.sec;document.querySelectorAll('[data-sec]').forEach(x=>x.classList.toggle('active',x===b));save()});buttons()})();
</script></body></html>
