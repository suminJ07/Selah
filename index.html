<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selah | 기도 음악 컨트롤러</title>
  <style>
    :root {
      font-family: system-ui, "Malgun Gothic", sans-serif;
      color-scheme: light;
      --page: #f7f5ef;
      --panel: #fffefa;
      --border: #dedfd7;
      --text: #28362e;
      --muted: #66746b;
      --input: #ffffff;
      --input-border: #cbd3c9;
      --video: #e9ece6;
      --surface: #edf0e9;
      --accent: #58765e;
      --accent-text: #ffffff;
      --secondary: #e1e7df;
      --secondary-text: #304535;
      --danger: #8d4c42;
      --danger-text: #ffffff;
      --shadow: 0 20px 55px #273b2b14;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --page: #151b1c;
      --panel: #20292a;
      --border: #354442;
      --text: #f0f2ec;
      --muted: #b4c0b7;
      --input: #151f20;
      --input-border: #50635b;
      --video: #101718;
      --surface: #2d3936;
      --accent: #a2b9a1;
      --accent-text: #18231d;
      --secondary: #36463e;
      --secondary-text: #f0f2ec;
      --danger: #ba776d;
      --danger-text: #141a18;
      --shadow: 0 20px 55px #0005;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      background: var(--page);
      color: var(--text);
      transition: background 0.2s, color 0.2s;
    }

    .app {
      width: min(100%, 750px);
      margin: 0 auto;
      padding: 28px;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .heading {
      margin-bottom: 16px;
    }

    .heading-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 30px;
      letter-spacing: -0.8px;
    }
    .sub {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 650;
    }

    .theme-picker {
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }
    .theme-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 9px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }
    .theme-icon:hover {
      background: var(--surface);
      color: var(--text);
    }
    .theme-icon:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .theme-icon svg {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .theme-icon [hidden] {
      display: none;
    }

    /* 상태 표시줄: 제목 아래에 일반 배치 (스크롤 시 함께 이동) */
    .status {
      margin-bottom: 12px;
      padding: 11px 13px;
      border: 1px solid var(--border);
      border-left: 4px solid var(--muted);
      border-radius: 12px;
      background: var(--panel);
      box-shadow: 0 6px 20px #0000000a;
    }

    .status[data-kind="ready"],
    .status[data-kind="playing"],
    .status[data-kind="done"] {
      border-left-color: var(--accent);
    }

    .status[data-kind="fading"] {
      border-left-color: #c78e44;
    }
    .status[data-kind="error"] {
      border-left-color: var(--danger);
    }
    .status-title {
      font-weight: 750;
      font-size: 15px;
    }
    .status-message {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }
    .error-details {
      max-height: min(22dvh, 170px);
      overflow-y: auto;
      overscroll-behavior: contain;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }
    .error-details p {
      margin: 5px 0;
      font-size: 13px;
      line-height: 1.6;
    }
    .error-code {
      color: var(--muted);
      font-size: 12px;
    }

    .error-toggle {
      display: inline-flex;
      margin-top: 7px;
      padding: 4px 0;
      border-radius: 4px;
      background: transparent;
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .error-toggle[hidden], .error-details[hidden] { display: none; }
    .control-dock .status-message { overflow-wrap: anywhere; }
    .control-dock .actions {
      position: sticky;
      bottom: -18px;
      z-index: 1;
      padding-top: 8px;
      background: var(--panel);
    }

    .urlrow {
      display: flex;
      gap: 8px;
    }
    input[type="url"] {
      width: 100%;
      min-width: 0;
      padding: 14px;
      border: 1px solid var(--input-border);
      border-radius: 10px;
      background: var(--input);
      color: var(--text);
      font-size: 15px;
    }

    button {
      padding: 14px 18px;
      border: 0;
      border-radius: 11px;
      background: var(--secondary);
      color: var(--secondary-text);
      font-size: 16px;
      font-weight: 750;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.42;
      cursor: not-allowed;
    }
    .load {
      white-space: nowrap;
    }

    input:focus-visible,
    button:focus-visible,
    select:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    .playerwrap {
      display: grid;
      place-items: center;
      overflow: hidden;
      margin-top: 18px;
      aspect-ratio: 16 / 9;
      border-radius: 12px;
      background: var(--video);
    }

    .playerwrap > div {
      width: 100%;
      height: 100%;
    }
    .placeholder {
      padding: 20px;
      color: var(--muted);
      text-align: center;
    }
    .vol {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 18px;
    }
    .vol label {
      margin: 0;
      white-space: nowrap;
    }
    .vol input {
      width: 100%;
      padding: 0;
      accent-color: var(--accent);
    }
    .vol span {
      min-width: 38px;
      text-align: right;
    }
    .settings {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 20px 0;
    }
    .settings label {
      margin: 0;
    }
    .fade-in-setting {
      margin: 0 0 12px;
    }
    .fade-in-toggle {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin: 0;
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .fade-in-toggle input {
      width: 18px;
      height: 18px;
      margin: 0;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .fade-in-hint {
      margin: 4px 0 0 28px;
      color: var(--muted);
      font-size: 12px;
    }
    .fade-in-toggle input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }
    .options {
      display: flex;
      gap: 5px;
    }
    .options button {
      padding: 10px 14px;
      font-size: 14px;
    }
    .options button.active {
      background: var(--accent);
      color: var(--accent-text);
    }
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .actions button {
      min-height: 60px;
    }
    .start {
      background: var(--accent);
      color: var(--accent-text);
    }
    .end {
      background: var(--danger);
      color: var(--danger-text);
    }
    .small {
      margin: 16px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    @media (max-width: 470px) {
      body {
        padding: 10px;
      }
      .app {
        padding: 18px;
      }
      .settings {
        align-items: flex-start;
        flex-direction: column;
      }
      .urlrow button {
        padding: 12px;
      }
      h1 {
        font-size: 25px;
      }
    }

    /* 좁은 창과 스크롤 상태에서도 주요 조작에 접근할 수 있는 하단 도크 */
    body {
      padding-bottom: 250px;
    }
    .control-dock {
      position: fixed;
      left: 50%;
      bottom: max(12px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 20;
      max-height: calc(100dvh - 20px);
      overflow-y: auto;
      overscroll-behavior: contain;
      width: min(750px, calc(100% - 40px));
      padding: 14px 24px 18px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: 0 12px 36px #00000024;
    }
    .control-dock .vol {
      margin-top: 0;
    }
    .control-dock .settings {
      margin: 12px 0;
    }
    .control-dock .actions button {
      min-height: 52px;
    }
    @media (max-width: 470px) {
      body {
        padding-bottom: 320px;
      }
      .control-dock {
        width: calc(100% - 20px);
        padding: 12px 16px 14px;
        bottom: max(8px, env(safe-area-inset-bottom));
      }
      .control-dock .settings {
        flex-direction: row;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
      }
      .control-dock .actions {
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .control-dock .actions button {
        min-height: 48px;
        padding: 10px 6px;
        font-size: 14px;
      }
      .control-dock .vol {
        gap: 8px;
      }
      .control-dock .vol label {
        font-size: 13px;
      }
      .control-dock .options button {
        padding: 8px 10px;
      }
    }
    @media (max-height: 430px) {
      .control-dock .status { padding: 8px 10px; margin-bottom: 8px; }
      .control-dock .fade-in-hint { display: none; }
      .control-dock .actions { bottom: -8px; }
      .control-dock {
        padding-top: 8px;
        padding-bottom: 8px;
      }
      .control-dock .settings {
        margin: 6px 0;
      }
      .control-dock .actions button {
        min-height: 38px;
      }
    }

    /* 반응형 레이아웃: 800px 이상은 2열, 미만은 하단 고정 컨트롤 */
    .workspace {
      width: 100%;
      min-width: 0;
    }

    @media (min-width: 800px) {
      body {
        padding: 36px 28px 48px;
      }
      .workspace {
        display: grid;
        grid-template-columns: minmax(0, 1.65fr) minmax(300px, 1fr);
        align-items: start;
        gap: 24px;
        max-width: 1260px;
        margin: 0 auto;
      }
      .app {
        width: 100%;
        min-width: 0;
        margin: 0;
        padding: 30px;
      }
      .control-dock {
        position: sticky;
        top: 36px;
        bottom: auto;
        left: auto;
        transform: none;
        width: 100%;
        min-width: 0;
        max-height: calc(100dvh - 72px);
        padding: 22px;
        box-shadow: var(--shadow);
      }
      .control-dock .settings {
        align-items: flex-start;
        flex-direction: column;
        gap: 10px;
        margin: 18px 0;
      }
      .control-dock .vol {
        flex-wrap: wrap;
      }
      .control-dock .vol label {
        width: 100%;
      }
      .control-dock .vol input {
        flex: 1;
        min-width: 0;
      }
      .control-dock .actions {
        bottom: -22px;
      }
      .small {
        margin-top: 22px;
      }
    }

    /* 데스크톱과 중간 화면: 플레이어가 남은 화면 높이를 사용하도록 조절합니다.
       높이가 충분한 창에서는 페이지 전체가 한 화면에 들어옵니다. */
    @media (min-width: 800px) and (min-height: 680px) {
      body {
        padding: 20px 28px;
      }
      .workspace {
        height: calc(100dvh - 40px);
        align-items: stretch;
      }
      .app {
        display: flex;
        flex-direction: column;
        height: 100%;
        min-height: 0;
        padding: 24px 30px;
      }
      .app .playerwrap {
        flex: 1 1 auto;
        min-height: 0;
        height: auto;
        aspect-ratio: auto;
        margin-top: 16px;
      }
      .app .small {
        flex: 0 0 auto;
        margin-top: 16px;
      }
      .control-dock {
        align-self: start;
        top: 20px;
        max-height: calc(100dvh - 40px);
      }
    }

    @media (min-width: 800px) and (max-height: 640px) {
      .control-dock {
        top: 12px;
        max-height: calc(100dvh - 24px);
      }
      .control-dock .fade-in-hint {
        display: none;
      }
    }

    /* 중간 화면에서도 2열을 유지하면서 간격과 내부 여백을 줄입니다. */
    @media (min-width: 800px) and (max-width: 1099px) {
      body { padding-left: 16px; padding-right: 16px; }
      .workspace {
        grid-template-columns: minmax(0, 1.4fr) minmax(300px, 1fr);
        gap: 14px;
      }
      .app { padding-left: 20px; padding-right: 20px; }
      .control-dock { padding: 16px; }
      .control-dock .settings { margin: 12px 0; }
      .control-dock .actions { bottom: -16px; gap: 8px; }
      .control-dock .actions button { padding: 10px 6px; font-size: 14px; }
    }

    @media (max-width: 799px) {
      .control-dock {
        width: calc(100% - 20px);
        bottom: max(8px, env(safe-area-inset-bottom));
        padding: 12px 16px 14px;
      }
      .control-dock .settings {
        flex-wrap: wrap;
        gap: 8px;
      }
      .control-dock .actions {
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        bottom: -14px;
      }
      .control-dock .actions button {
        min-height: 48px;
        padding: 10px 6px;
        font-size: 14px;
      }
      .control-dock .vol {
        gap: 8px;
      }
      .control-dock .vol label {
        font-size: 13px;
      }
      .control-dock .options button {
        padding: 8px 10px;
      }
    }

    @media (max-width: 470px) {
      .control-dock .fade-in-hint {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="workspace">
  <main class="app">
    <header class="heading">
      <div class="heading-row">
        <h1>Selah<span aria-hidden="true">.</span></h1>
        <div class="theme-picker">
          <button type="button" class="theme-icon" id="themeToggle" aria-label="다크 모드로 전환" title="다크 모드로 전환">
            <svg id="themeSun" viewBox="0 0 24 24" aria-hidden="true" hidden><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>
            <svg id="themeMoon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z"/></svg>
          </button>
        </div>
      </div>
      <p class="sub">음악의 시작과 끝을 부드럽게</p>
    </header>

    <label for="url">유튜브 음악 주소</label>
    <div class="urlrow">
      <input id="url" type="url" placeholder="https://youtu.be/..." autocomplete="off">
      <button class="load" id="load">불러오기</button>
    </div>

    <div class="playerwrap" id="playerWrap">
      <div class="placeholder" id="placeholder">유튜브 주소를 입력하고 불러오기를 눌러주세요.</div>
    </div>

    <p class="small">
      ※ 이 페이지에서 재생한 음악만 제어합니다. PC 전체 음소거는 하지 않습니다.<br>
      ※ 일부 유튜브 영상은 외부 사이트 재생이 차단될 수 있습니다. 사용 전에 재생 여부를 확인해 주세요.
    </p>
  </main>

  <!-- 음악 조작은 화면 아래에 항상 표시합니다. 기존 ID와 이벤트 연결은 유지합니다. -->
  <aside class="control-dock" aria-label="음악 재생 컨트롤">
    <section class="status" id="status" data-kind="idle" role="status" aria-live="polite">
      <div class="status-title" id="statusTitle">음악 대기 중</div>
      <p class="status-message" id="statusMessage">유튜브 음악 주소를 입력해 주세요.</p>
      <button type="button" class="error-toggle" id="errorToggle" aria-expanded="false" aria-controls="errorDetails" hidden>자세히 보기</button>
      <div class="error-details" id="errorDetails" hidden>
        <p><strong>발생 가능한 원인</strong> · <span id="errorCause"></span></p>
        <p><strong>해결 방법</strong> · <span id="errorSolution"></span></p>
        <span class="error-code" id="errorCode"></span>
      </div>
    </section>

    <div class="fade-in-setting">
      <label class="fade-in-toggle" for="fadeInEnabled">
        <input id="fadeInEnabled" type="checkbox">
        페이드 인 사용 (3초)
      </label>
      <p class="fade-in-hint">음악을 처음 시작할 때 3초 동안 서서히 커집니다.</p>
    </div>

    <div class="vol">
      <label for="volume">시작 볼륨</label>
      <input id="volume" type="range" min="0" max="100" value="70">
      <span id="volumeText">70%</span>
    </div>

    <div class="settings">
      <label>페이드 아웃 시간</label>
      <div class="options" id="fadeOptions" aria-label="페이드 아웃 시간">
        <button data-sec="3">3초</button>
        <button data-sec="4">4초</button>
        <button data-sec="5" class="active">5초</button>
      </div>
    </div>

    <div class="actions">
      <button id="start" class="start" disabled>▶ 음악 시작</button>
      <button id="end" class="end" disabled>◼ 음악 종료</button>
    </div>

  </aside>
</div>

  <script>
    // 고정 컨트롤에 본문이 가리지 않도록 실제 도크 높이에 맞춰 여백을 조정합니다.
    (() => {
      const dock = document.querySelector('.control-dock');
      if (!dock) return;
      const syncDockSpace = () => {
        // 2열 데스크톱에서는 도크가 본문 흐름에 있으므로 추가 여백이 필요하지 않습니다.
        if (window.matchMedia('(min-width: 800px)').matches) {
          document.body.style.paddingBottom = '';
          return;
        }
        const bottomGap = parseFloat(getComputedStyle(dock).bottom) || 0;
        document.body.style.paddingBottom = `${Math.ceil(dock.getBoundingClientRect().height + bottomGap + 24)}px`;
      };
      syncDockSpace();
      window.addEventListener('resize', syncDockSpace);
      if ('ResizeObserver' in window) new ResizeObserver(syncDockSpace).observe(dock);
    })();
  </script>

  <script>
    // 저장된 선택이 없으면 시스템 테마를 따르고, 클릭 시 반대 테마로 전환합니다.
    (() => {
      "use strict";

      const storageKey = "selahTheme";
      const root = document.documentElement;
      const toggleButton = document.getElementById("themeToggle");
      const sunIcon = document.getElementById("themeSun");
      const moonIcon = document.getElementById("themeMoon");
      const media = window.matchMedia("(prefers-color-scheme: dark)");
      let selected = "system";

      try {
        const saved = localStorage.getItem(storageKey);
        if (["system", "light", "dark"].includes(saved)) selected = saved;
      } catch (error) {
        // 저장소 접근이 차단된 경우 시스템 테마를 사용합니다.
      }

      function applyTheme() {
        const effectiveTheme = selected === "system"
          ? (media.matches ? "dark" : "light")
          : selected;
        root.dataset.theme = effectiveTheme;

        const switchToDark = effectiveTheme === "light";
        moonIcon.hidden = !switchToDark;
        sunIcon.hidden = switchToDark;
        const label = switchToDark ? "다크 모드로 전환" : "라이트 모드로 전환";
        toggleButton.setAttribute("aria-label", label);
        toggleButton.title = label;
      }

      toggleButton.addEventListener("click", () => {
        selected = root.dataset.theme === "light" ? "dark" : "light";
        try {
          localStorage.setItem(storageKey, selected);
        } catch (error) {
          // 저장 실패해도 현재 화면의 테마 전환은 유지합니다.
        }
        applyTheme();
      });

      const onSystemThemeChange = () => {
        if (selected === "system") applyTheme();
      };

      if (media.addEventListener) {
        media.addEventListener("change", onSystemThemeChange);
      } else if (media.addListener) {
        media.addListener(onSystemThemeChange);
      }

      applyTheme();
    })();
  </script>

  <script>
    (() => {
      "use strict";

      const $ = (id) => document.getElementById(id);
      const urlInput = $("url");
      const loadButton = $("load");
      const startButton = $("start");
      const endButton = $("end");
      const volumeInput = $("volume");
      const volumeText = $("volumeText");
      const fadeInInput = $("fadeInEnabled");

      let player = null;
      let ready = false;
      let fadeSeconds = 5;
      let fadeTimer = null;
      let fadeToken = 0;
      const fadeInDuration = 3000;
      let fadeInTimer = null;
      let fadeInToken = 0;
      let fadeInPending = false;
      let hasStartedPlayback = false;
      let loadedVideoId = "";
      let mode = "idle";
      let apiRequested = false;
      let loadTimeout = null;
      let requestVersion = 0;

      const youtubeErrors = {
        2: {
          title: "영상 정보를 확인할 수 없습니다",
          cause: "유튜브 플레이어가 잘못된 영상 ID 또는 매개변수를 받았습니다.",
          solution: "유튜브 공유 링크를 다시 복사하거나 다른 영상을 사용해 주세요."
        },
        5: {
          title: "플레이어에서 영상을 재생하지 못했습니다",
          cause: "HTML5 플레이어에서 재생 문제가 발생했습니다.",
          solution: "페이지를 새로고침하거나 다른 브라우저에서 시도해 주세요."
        },
        100: {
          title: "영상을 찾을 수 없습니다",
          cause: "영상이 삭제되었거나 비공개 상태일 수 있습니다.",
          solution: "유튜브에서 해당 영상이 열리는지 확인하거나 다른 영상을 선택해 주세요."
        },
        101: {
          title: "외부 사이트 재생이 제한되었습니다",
          cause: "영상 소유자가 다른 웹사이트에서의 재생을 허용하지 않았습니다.",
          solution: "외부 재생이 허용된 다른 유튜브 영상을 사용해 주세요."
        },
        150: {
          title: "외부 사이트 재생이 제한되었습니다",
          cause: "영상 소유자가 다른 웹사이트에서의 재생을 허용하지 않았습니다.",
          solution: "외부 재생이 허용된 다른 유튜브 영상을 사용해 주세요."
        },
        153: {
          title: "플레이어 실행 환경을 확인할 수 없습니다",
          cause: "유튜브가 필요한 HTTP Referer 또는 동등한 식별 정보를 받지 못했습니다.",
          solution: "GitHub Pages의 HTTPS 주소에서 접속했는지 확인하고 다시 시도해 주세요."
        }
      };

      function setStatus(kind, title, message, detail = null) {
        $("status").dataset.kind = kind;
        $("statusTitle").textContent = title;
        $("statusMessage").textContent = message;
        const errorToggle = $("errorToggle");
        const errorDetails = $("errorDetails");
        errorToggle.hidden = !detail;
        errorToggle.setAttribute("aria-expanded", "false");
        errorToggle.textContent = "자세히 보기";
        errorDetails.hidden = true;

        if (detail) {
          $("errorCause").textContent = detail.cause;
          $("errorSolution").textContent = detail.solution;
          $("errorCode").textContent = detail.code || "";
        }
      }

      $("errorToggle").addEventListener("click", () => {
        const details = $("errorDetails");
        const expanded = details.hidden;
        details.hidden = !expanded;
        $("errorToggle").setAttribute("aria-expanded", String(expanded));
        $("errorToggle").textContent = expanded ? "접기" : "자세히 보기";
      });

      function showError(code) {
        const info = youtubeErrors[code] || {
          title: "영상을 재생하지 못했습니다",
          cause: "유튜브 플레이어에서 알 수 없는 오류가 전달되었습니다.",
          solution: "페이지를 새로고침하거나 다른 영상을 사용해 주세요."
        };

        setStatus("error", info.title, "아래 안내를 확인해 주세요.", {
          ...info,
          code: `YouTube 오류 코드: ${code}`
        });
      }

      function saveSettings() {
        try {
          localStorage.setItem("prayerSettings", JSON.stringify({
            url: urlInput.value,
            volume: Number(volumeInput.value),
            fadeSec: fadeSeconds,
            fadeInEnabled: fadeInInput.checked
          }));
        } catch (error) {
          // 저장소를 사용할 수 없어도 음악 기능은 계속 동작합니다.
        }
      }

      function restoreSettings() {
        try {
          const settings = JSON.parse(localStorage.getItem("prayerSettings") || "{}");
          if (settings.url) urlInput.value = settings.url;
          if (Number.isFinite(settings.volume)) {
            volumeInput.value = Math.min(100, Math.max(0, settings.volume));
          }
          if ([3, 4, 5].includes(settings.fadeSec)) fadeSeconds = settings.fadeSec;
          fadeInInput.checked = settings.fadeInEnabled === true;
        } catch (error) {
          // 이전 설정이 손상되었으면 기본값을 사용합니다.
        }

        volumeText.textContent = `${volumeInput.value}%`;
        document.querySelectorAll("[data-sec]").forEach((button) => {
          button.classList.toggle("active", Number(button.dataset.sec) === fadeSeconds);
        });
      }

      function parseVideoId(rawUrl) {
        try {
          const parsed = new URL(rawUrl.trim());
          if (!["https:", "http:"].includes(parsed.protocol)) return null;

          const hostname = parsed.hostname.toLowerCase().replace(/^www\./, "");
          let videoId = "";

          if (hostname === "youtu.be") {
            videoId = parsed.pathname.split("/")[1];
          } else if ([
            "youtube.com",
            "m.youtube.com",
            "music.youtube.com",
            "youtube-nocookie.com"
          ].includes(hostname)) {
            if (parsed.pathname === "/watch") {
              videoId = parsed.searchParams.get("v");
            } else if (/^\/(embed|shorts|live)\//.test(parsed.pathname)) {
              videoId = parsed.pathname.split("/")[2];
            }
          }

          return /^[a-zA-Z0-9_-]{11}$/.test(videoId || "") ? videoId : null;
        } catch (error) {
          return null;
        }
      }

      function updateButtons() {
        startButton.disabled = !ready || mode === "playing" || mode === "fading";
        endButton.disabled = !ready || mode !== "playing";
        loadButton.disabled = mode === "fading";
      }

      function cancelFade() {
        fadeToken += 1;
        if (fadeTimer !== null) {
          clearInterval(fadeTimer);
          fadeTimer = null;
        }
      }

      function cancelFadeIn() {
        fadeInToken += 1;
        fadeInPending = false;
        if (fadeInTimer !== null) {
          clearInterval(fadeInTimer);
          fadeInTimer = null;
        }
      }

      function beginFadeIn() {
        if (!fadeInPending || !player || !ready) return;
        fadeInPending = false;
        const token = ++fadeInToken;
        const targetVolume = Number(volumeInput.value);
        const startedAt = performance.now();
        setStatus("playing", "음악 재생 중", "3초 동안 음악 볼륨을 서서히 높이고 있습니다…");

        fadeInTimer = setInterval(() => {
          if (token !== fadeInToken) return;
          const progress = Math.min(1, (performance.now() - startedAt) / fadeInDuration);
          try {
            player.setVolume(Math.round(targetVolume * progress));
            if (progress >= 1) {
              cancelFadeIn();
              setStatus("playing", "음악 재생 중", "음악을 마칠 때 종료 버튼을 눌러주세요.");
            }
          } catch (error) {
            cancelFadeIn();
            mode = "error";
            updateButtons();
            setStatus("error", "페이드 인을 완료하지 못했습니다", "플레이어를 확인해 주세요.", {
              cause: "볼륨 제어 도중 플레이어와 통신하지 못했습니다.",
              solution: "플레이어 상태를 확인하고 음악을 다시 시작해 주세요.",
              code: "Selah 볼륨 제어 오류 · YouTube 오류 코드 없음"
            });
          }
        }, 50);
      }

      function clearLoadTimeout() {
        if (loadTimeout !== null) {
          clearTimeout(loadTimeout);
          loadTimeout = null;
        }
      }

      function ensureYoutubeApi() {
        if (window.YT && YT.Player) {
          createPlayer(loadedVideoId);
          return;
        }
        if (apiRequested) return;

        apiRequested = true;
        const script = document.createElement("script");
        script.src = "https://www.youtube.com/iframe_api";
        script.onerror = () => {
          apiRequested = false;
          clearLoadTimeout();
          mode = "error";
          updateButtons();
          setStatus("error", "유튜브 연결에 실패했습니다", "플레이어 스크립트를 불러오지 못했습니다.", {
            cause: "네트워크 연결, 브라우저 차단 설정 등 여러 원인이 있을 수 있습니다.",
            solution: "인터넷 연결을 확인하고 페이지를 새로고침해 주세요.",
            code: "Selah 연결 오류 · YouTube 오류 코드 없음"
          });
        };
        document.head.appendChild(script);
      }

      function createPlayer(videoId) {
        clearLoadTimeout();
        cancelFadeIn();
        cancelFade();
        hasStartedPlayback = false;
        ready = false;
        mode = "loading";
        updateButtons();
        setStatus("loading", "영상 연결 중", "유튜브 플레이어를 준비하고 있습니다…");

        if (player) {
          try { player.destroy(); } catch (error) { /* 이미 제거된 플레이어 */ }
          player = null;
        }

        const version = ++requestVersion;
        const wrapper = $("playerWrap");
        wrapper.replaceChildren();
        const mount = document.createElement("div");
        mount.id = "yt-player";
        wrapper.appendChild(mount);

        loadTimeout = setTimeout(() => {
          if (version !== requestVersion || ready || mode !== "loading") return;
          loadTimeout = null;
          mode = "error";
          updateButtons();
          setStatus("error", "영상 연결이 지연되고 있습니다", "플레이어 응답을 기다리는 중입니다.", {
            cause: "네트워크 지연이나 브라우저 설정 등으로 로딩이 늦어질 수 있습니다.",
            solution: "잠시 기다리거나 새로고침한 뒤 다시 시도해 주세요.",
            code: "Selah 로딩 지연 · YouTube 오류 코드 없음"
          });
        }, 15000);

        player = new YT.Player("yt-player", {
          videoId,
          width: "100%",
          height: "100%",
          playerVars: {
            playsinline: 1,
            rel: 0,
            origin: location.origin.startsWith("http") ? location.origin : undefined
          },
          events: {
            onReady(event) {
              if (version !== requestVersion) return;
              clearLoadTimeout();
              ready = true;
              mode = "ready";
              event.target.setVolume(Number(volumeInput.value));
              event.target.pauseVideo();
              updateButtons();
              setStatus("ready", "음악 준비 완료", "음악 시작 버튼을 눌러주세요.");
            },
            onStateChange(event) {
              if (version !== requestVersion || !ready || mode === "fading") return;

              if (event.data === YT.PlayerState.PLAYING) {
                mode = "playing";
                hasStartedPlayback = true;
                if (fadeInPending) {
                  beginFadeIn();
                } else if (fadeInTimer === null) {
                  setStatus("playing", "음악 재생 중", "음악을 마칠 때 종료 버튼을 눌러주세요.");
                }
              } else if (event.data === YT.PlayerState.ENDED) {
                cancelFadeIn();
                hasStartedPlayback = false;
                mode = "ready";
                setStatus("done", "영상 재생 완료", "영상이 끝났습니다.");
              } else if (event.data === YT.PlayerState.PAUSED && mode === "playing") {
                const wasFadingIn = fadeInPending || fadeInTimer !== null;
                cancelFadeIn();
                if (wasFadingIn) {
                  event.target.setVolume(Number(volumeInput.value));
                }
                mode = "ready";
                setStatus("ready", "음악 일시정지", "음악 시작 버튼을 누르면 다시 재생됩니다.");
              }

              updateButtons();
            },
            onError(event) {
              if (version !== requestVersion) return;
              clearLoadTimeout();
              cancelFadeIn();
              cancelFade();
              ready = false;
              mode = "error";
              updateButtons();
              showError(event.data);
            }
          }
        });
      }

      window.onYouTubeIframeAPIReady = () => {
        if (loadedVideoId) createPlayer(loadedVideoId);
      };

      loadButton.addEventListener("click", () => {
        const videoId = parseVideoId(urlInput.value);
        if (!videoId) {
          setStatus("error", "유튜브 주소를 확인해 주세요", "올바른 영상 링크를 입력해 주세요.", {
            cause: "지원하지 않는 주소이거나 영상 ID가 포함되어 있지 않습니다.",
            solution: "유튜브 영상의 공유 버튼을 눌러 링크를 복사해 주세요. 재생목록만 있는 링크는 지원하지 않습니다.",
            code: "Selah 주소 확인 · YouTube 오류 코드 없음"
          });
          return;
        }

        cancelFade();
        cancelFadeIn();
        loadedVideoId = videoId;
        saveSettings();

        if (window.YT && YT.Player) {
          createPlayer(videoId);
        } else {
          mode = "loading";
          updateButtons();
          setStatus("loading", "플레이어 불러오는 중", "유튜브 연결을 준비하고 있습니다…");
          ensureYoutubeApi();
        }
      });

      startButton.addEventListener("click", () => {
        if (!ready || !player) return;
        cancelFade();
        cancelFadeIn();
        const useFadeIn = fadeInInput.checked && !hasStartedPlayback;
        fadeInPending = useFadeIn;
        player.unMute();
        player.setVolume(useFadeIn ? 0 : Number(volumeInput.value));
        player.playVideo();
        mode = "playing";
        updateButtons();
        setStatus("loading", "재생 요청 중", "음악이 시작되는지 확인하고 있습니다…");
      });

      endButton.addEventListener("click", () => {
        if (!ready || !player || mode !== "playing") return;
        cancelFade();
        cancelFadeIn();
        mode = "fading";
        updateButtons();

        const token = fadeToken;
        const initialVolume = player.getVolume();
        const startedAt = performance.now();
        const duration = fadeSeconds * 1000;

        setStatus("fading", "페이드 아웃 중", `${fadeSeconds}초 동안 음악을 서서히 줄이고 있습니다…`);

        fadeTimer = setInterval(() => {
          if (token !== fadeToken) return;
          const progress = Math.min(1, (performance.now() - startedAt) / duration);

          try {
            player.setVolume(Math.round(initialVolume * (1 - progress)));
            if (progress >= 1) {
              clearInterval(fadeTimer);
              fadeTimer = null;
              player.setVolume(0);
              player.mute();
              player.pauseVideo();
              hasStartedPlayback = false;
              mode = "ready";
              updateButtons();
              setStatus("done", "음악 종료 완료", "볼륨 0% · 음소거 · 재생 일시정지");
            }
          } catch (error) {
            cancelFade();
            mode = "error";
            updateButtons();
            setStatus("error", "페이드 아웃을 완료하지 못했습니다", "플레이어를 확인해 주세요.", {
              cause: "볼륨 제어 도중 플레이어와 통신하지 못했습니다.",
              solution: "음악이 계속 들린다면 유튜브 플레이어에서 직접 일시정지해 주세요.",
              code: "Selah 볼륨 제어 오류 · YouTube 오류 코드 없음"
            });
          }
        }, 50);
      });

      volumeInput.addEventListener("input", () => {
        volumeText.textContent = `${volumeInput.value}%`;
        saveSettings();
        if (ready && mode !== "fading" && fadeInTimer === null && !fadeInPending) {
          try { player.setVolume(Number(volumeInput.value)); } catch (error) { /* 무시 */ }
        }
      });

      fadeInInput.addEventListener("change", saveSettings);
      urlInput.addEventListener("change", saveSettings);
      document.querySelectorAll("[data-sec]").forEach((button) => {
        button.addEventListener("click", () => {
          fadeSeconds = Number(button.dataset.sec);
          document.querySelectorAll("[data-sec]").forEach((item) => {
            item.classList.toggle("active", item === button);
          });
          saveSettings();
        });
      });

      restoreSettings();
      updateButtons();
    })();
  </script>
</body>
</html>
